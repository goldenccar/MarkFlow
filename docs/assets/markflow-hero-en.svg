<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MarkFlow: One source. Reports and slides.</title>
  <desc id="desc">Conceptual workflow, not an application screenshot. Markdown or structured content becomes shared Mark content and editable DOCX reports and PPTX slides. In the fictional Ridge project, the team count changes from 12 to 18 and both deliverables use the updated fact.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .ink { fill: #173f35; } .muted { fill: #64776e; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 6 5 2 9" stroke="#7c9485" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1600" height="800" rx="32" fill="#f5f6f3"/>
  <rect x="72" y="55" width="44" height="44" rx="12" fill="#173f35"/>
  <path d="M83 86V69l11 11 11-11v17" stroke="#f5f6f3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="88" class="ink" font-size="30" font-weight="700" letter-spacing="-.7">MarkFlow</text>
  <circle cx="1300" cy="78" r="4" fill="#d58a58"/>
  <text x="1315" y="85" class="muted" font-size="18">Conceptual workflow</text>
  <text x="72" y="211" class="ink" font-size="75" font-weight="700" letter-spacing="-2.7">One source. Reports and slides.</text>
  <text x="76" y="264" class="muted" font-size="27">Write the facts once. Give every format its own presentation.</text>

