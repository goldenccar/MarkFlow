  <text x="76" y="746" class="muted" font-size="18">Project Ridge is a fictional example.</text>
  <text x="1528" y="746" text-anchor="end" fill="#365f55" font-size="19" letter-spacing=".5">CONTENT → STRUCTURE → DELIVERY</text>
