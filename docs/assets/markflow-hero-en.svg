  <path d="M955 407H972" stroke="#7c9485" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M955 597H972" stroke="#7c9485" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="936" cy="500" r="5" fill="#d58a58"/>

  <rect x="72" y="334" width="378" height="336" rx="24" fill="#fff" stroke="#dbe3dc" stroke-width="1.5"/>
  <circle cx="101" cy="369" r="4" fill="#d58a58"/>
  <text x="115" y="376" class="muted" font-size="17">Markdown / structured content</text>
