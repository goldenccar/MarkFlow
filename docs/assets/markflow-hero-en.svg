  <text x="1010" y="607" class="ink" font-size="31" font-weight="650">Project slides</text>
  <text x="1010" y="644" class="muted" font-size="19">Editable text, images and layout</text>
  <path d="M1340 583V651" stroke="#e0e7e0" stroke-width="1.5"/>
